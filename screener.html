<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidity Finder - Query Screener</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-panel: rgba(19, 23, 34, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #d1d4dc;
            --text-muted: #848e9c;
            --up-color: #00e676;
            --up-bg: rgba(0, 230, 118, 0.1);
            --down-color: #ff5252;
            --down-bg: rgba(255, 82, 82, 0.1);
            --idm-color: #ffd600;
            --btn-blue: #2962ff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(0, 230, 118, 0.05), transparent 40%),
                        radial-gradient(circle at 85% 30%, rgba(255, 82, 82, 0.05), transparent 40%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #848e9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-actions a, .btn {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 6px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            transition: all 0.2s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .header-actions a:hover, .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .btn-primary {
            background: var(--btn-blue);
            border-color: var(--btn-blue);
        }
        .btn-primary:hover {
            background: #1e4bd8;
        }

        main {
            padding: 40px;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* Query Builder */
        .query-builder {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .query-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        
        .condition-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.02);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .logic-op {
            font-weight: 800;
            color: var(--btn-blue);
            width: 40px;
            text-align: center;
        }
        
        select {
            background: #131722;
            color: #fff;
            border: 1px solid var(--border-glass);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            min-width: 150px;
        }
        
        select:focus {
            border-color: var(--btn-blue);
        }
        
        .remove-btn {
            background: transparent;
            color: var(--down-color);
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0 5px;
        }
        
        .query-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        /* Results Table */
        .results-section {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .results-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 15px 20px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(0,0,0,0.2);
        }
        
        td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            color: #fff;
        }
        
        tr:hover td {
            background: rgba(255,255,255,0.03);
        }
        
        .symbol-link {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
        }
        
        .symbol-link:hover {
            color: var(--btn-blue);
        }

        .badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .badge-up { color: var(--up-color); background: var(--up-bg); }
        .badge-down { color: var(--down-color); background: var(--down-bg); }
        .badge-idm { color: var(--idm-color); background: rgba(255, 214, 0, 0.1); border: 1px solid rgba(255, 214, 0, 0.3); }
        .badge-noidm { color: var(--text-muted); background: var(--bg-glass); }

        .loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
        }
        
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--btn-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .status-text {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    
    <header>
        <h1>SMC Query Screener</h1>
        <div class="header-actions">
            <a href="/">Chart Dashboard</a>
            <a onclick="fetchScreenerData(true)" style="margin-left: 10px;">Force Rescan</a>
        </div>
    </header>

    <main>
        <div class="query-builder">
            <div class="query-title">
                <span>Filter Rules</span>
                <span id="cache-status" class="status-text"></span>
            </div>
            
            <div id="conditions-container">
                <!-- Condition Rows go here -->
            </div>
            
            <div class="query-actions">
                <button class="btn" onclick="addCondition()">+ Add Filter</button>
                <button class="btn btn-primary" onclick="runScan()">Run Scan</button>
            </div>
        </div>

        <div class="results-section">
            <div class="results-header">
                <div style="font-weight: 600;">Scan Results</div>
                <div id="results-count" class="status-text">0 symbols found</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Trend</th>
                        <th>Inducement Status</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <!-- Rows go here -->
                </tbody>
            </table>
        </div>
    </main>

    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <div style="color: #fff; font-weight: 600; font-size: 16px;">Scanning SMC structure across all futures symbols...</div>
        <div style="font-size: 13px; color: var(--text-muted); margin-top: 10px;">This may take a minute. Please wait.</div>
    </div>

    <script>
        let allData = [];
        let conditions = [];

        function addCondition(field = 'trend', operator = '==', val = '1') {
            const id = Date.now() + Math.random();
            conditions.push({ id, field, operator, val });
            renderConditions();
        }

        function removeCondition(id) {
            conditions = conditions.filter(c => c.id !== id);
            renderConditions();
        }

        function updateCondition(id, key, value) {
            const cond = conditions.find(c => c.id === id);
            if (cond) {
                cond[key] = value;
                // reset value if field changes to keep types sane
                if (key === 'field') {
                    cond.val = value === 'trend' ? '1' : 'true';
                }
            }
            renderConditions();
        }

        function renderConditions() {
            const container = document.getElementById('conditions-container');
            container.innerHTML = '';
            
            if (conditions.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted); font-size: 14px; padding: 10px 0;">No filters applied. Showing all stocks.</div>';
                return;
            }

            conditions.forEach((cond, index) => {
                const row = document.createElement('div');
                row.className = 'condition-row';
                
                const logicLabel = index === 0 ? 'WHERE' : 'AND';
                
                let valueOptions = '';
                if (cond.field === 'trend') {
                    valueOptions = `
                        <option value="1" ${cond.val === '1' ? 'selected' : ''}>Uptrend</option>
                        <option value="-1" ${cond.val === '-1' ? 'selected' : ''}>Downtrend</option>
                    `;
                } else if (cond.field === 'inducement_done') {
                    valueOptions = `
                        <option value="true" ${cond.val === 'true' ? 'selected' : ''}>Completed</option>
                        <option value="false" ${cond.val === 'false' ? 'selected' : ''}>Not Completed</option>
                    `;
                }

                row.innerHTML = `
                    <div class="logic-op">${logicLabel}</div>
                    <select onchange="updateCondition(${cond.id}, 'field', this.value)">
                        <option value="trend" ${cond.field === 'trend' ? 'selected' : ''}>Trend</option>
                        <option value="inducement_done" ${cond.field === 'inducement_done' ? 'selected' : ''}>Inducement</option>
                    </select>
                    <select onchange="updateCondition(${cond.id}, 'operator', this.value)">
                        <option value="==" ${cond.operator === '==' ? 'selected' : ''}>Equals</option>
                        <option value="!=" ${cond.operator === '!=' ? 'selected' : ''}>Not Equals</option>
                    </select>
                    <select onchange="updateCondition(${cond.id}, 'val', this.value)">
                        ${valueOptions}
                    </select>
                    <button class="remove-btn" onclick="removeCondition(${cond.id})">×</button>
                `;
                container.appendChild(row);
            });
        }

        function runScan() {
            let filtered = allData;
            
            conditions.forEach(cond => {
                filtered = filtered.filter(item => {
                    let itemVal = item[cond.field];
                    let compareVal = cond.val;
                    
                    // Parse types
                    if (cond.field === 'trend') {
                        compareVal = parseInt(compareVal);
                    } else if (cond.field === 'inducement_done') {
                        compareVal = compareVal === 'true';
                    }
                    
                    if (cond.operator === '==') return itemVal === compareVal;
                    if (cond.operator === '!=') return itemVal !== compareVal;
                    return true;
                });
            });
            
            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';
            document.getElementById('results-count').innerText = `${data.length} symbols found`;
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:30px; color:var(--text-muted);">No symbols match the criteria.</td></tr>';
                return;
            }
            
            data.forEach(item => {
                const tr = document.createElement('tr');
                
                const trendBadge = item.trend === 1 
                    ? '<span class="badge badge-up">UPTREND</span>' 
                    : '<span class="badge badge-down">DOWNTREND</span>';
                    
                const idmBadge = item.inducement_done 
                    ? '<span class="badge badge-idm">COMPLETED</span>' 
                    : '<span class="badge badge-noidm">PENDING</span>';
                
                tr.innerHTML = `
                    <td><a href="/?symbol=${item.symbol}&timeframe=1d" target="_blank" class="symbol-link">${item.symbol}</a></td>
                    <td>${trendBadge}</td>
                    <td>${idmBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function fetchScreenerData(forceRefresh = false) {
            if (forceRefresh) {
                document.getElementById('loader').style.display = 'flex';
            }
            
            try {
                const url = forceRefresh ? '/api/screener?refresh=true' : '/api/screener';
                const response = await fetch(url);
                const result = await response.json();
                
                allData = result.data || [];
                
                const cacheStatus = document.getElementById('cache-status');
                if (result.cached) {
                    const d = new Date(result.timestamp * 1000);
                    cacheStatus.innerText = `Data loaded from cache (${d.toLocaleTimeString()})`;
                    cacheStatus.style.color = '#00e676';
                } else {
                    cacheStatus.innerText = `Live Scan Completed`;
                    cacheStatus.style.color = '#ff9800';
                }
                
                runScan();
                
            } catch (err) {
                console.error(err);
                alert("Failed to fetch screener data.");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        // Initialize default rules and fetch data
        window.addEventListener('DOMContentLoaded', () => {
            // Default filter: Uptrend + Inducement Completed
            addCondition('trend', '==', '1');
            addCondition('inducement_done', '==', 'true');
            
            fetchScreenerData(false);
        });
    </script>
</body>
</html>
