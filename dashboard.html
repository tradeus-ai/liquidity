<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidity Finder & Market Structure Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #131722;
            --header-bg: #1e222d;
            --border-color: #363c4e;
            --text-color: #d1d4dc;
            --accent-color: #2962ff;
            --accent-hover: #1e4bd8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Control Bar */
        header {
            height: 55px;
            flex-shrink: 0;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 20px;
            z-index: 100;
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        label {
            font-size: 13px;
            color: #848e9c;
        }

        select {
            background: #131722;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            min-width: 150px;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .tf-buttons {
            display: flex;
            gap: 4px;
            background: #131722;
            padding: 3px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .tf-btn {
            background: transparent;
            color: #848e9c;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tf-btn:hover {
            color: #fff;
        }

        .tf-btn.active {
            background: var(--accent-color);
            color: #fff;
        }

        .status-badge {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(8, 153, 129, 0.2);
            color: #089981;
            display: none;
        }

        /* Chart Area */
        #chart-container {
            height: calc(100vh - 55px - 32px);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Bottom TradingView-style Footer Bar */
        #chart-footer {
            height: 32px;
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 12px;
            color: #848e9c;
            user-select: none;
            z-index: 100;
        }

        .footer-presets {
            display: flex;
            gap: 6px;
        }

        .footer-btn {
            background: transparent;
            border: none;
            color: #848e9c;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
            transition: all 0.15s ease;
        }

        .footer-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .footer-clock {
            font-family: monospace;
            color: #848e9c;
            font-size: 12px;
        }

        /* Large Hover OHLC Legend */
        #hover-legend {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            font-size: 20px !important;
            font-weight: 600 !important;
            font-family: monospace;
            color: #ffffff;
            pointer-events: none;
            background: rgba(19, 23, 34, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .legend-title {
            font-size: 16px;
            color: #848e9c;
            margin-bottom: 4px;
        }

        .legend-val {
            margin-right: 12px;
        }

    <!-- Bottom TradingView-style Time Scale Footer -->
    <div id="chart-footer">
        <div class="footer-presets">
            <button class="footer-btn" onclick="fitRange('1d')">1D</button>
            <button class="footer-btn" onclick="fitRange('5d')">5D</button>
            <button class="footer-btn" onclick="fitRange('1m')">1M</button>
            <button class="footer-btn" onclick="fitRange('3m')">3M</button>
            <button class="footer-btn" onclick="fitRange('6m')">6M</button>
            <button class="footer-btn" onclick="fitRange('ytd')">YTD</button>
            <button class="footer-btn" onclick="fitRange('1y')">1Y</button>
            <button class="footer-btn" onclick="fitRange('all')">All</button>
        </div>
        <div class="footer-clock" id="live-clock">--:--:-- UTC+5:30</div>
    </div>

    <script>
        let chart = null;
        let candleSeries = null;
        let pullbackLine = null;
        let boxPrimitives = [];

        let currentSymbol = 'AMBUJACEM';
        let currentTimeframe = '1d';
        let currentMarket = 'futures';

        // Initialize Chart
        function initChart() {
            const container = document.getElementById('chart-container');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: {
                    backgroundColor: '#131722',
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: 'rgba(42, 46, 57, 0.5)' },
                    horzLines: { color: 'rgba(42, 46, 57, 0.5)' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                timeScale: {
                    borderColor: '#363c4e',
                    visible: true,
                    timeVisible: true,
                    secondsVisible: false,
                },
                rightPriceScale: {
                    borderColor: '#363c4e',
                }
            });

            // Solid White Candle Styling
            candleSeries = chart.addCandlestickSeries({
                upColor: '#ffffff',
                downColor: '#ffffff',
                borderUpColor: '#ffffff',
                borderDownColor: '#ffffff',
                wickUpColor: '#ffffff',
                wickDownColor: '#ffffff',
            });

            // Bold Orange Structure Pullback Line
            pullbackLine = chart.addLineSeries({
                color: '#ff9800',
                lineWidth: 3,
                crosshairMarkerVisible: false,
            });

            // Hover Legend & Date/Time Handler
            chart.subscribeCrosshairMove(param => {
                if (!param || !param.time) {
                    document.getElementById('leg-date').innerText = '-';
                    document.getElementById('leg-o').innerText = '-';
                    document.getElementById('leg-h').innerText = '-';
                    document.getElementById('leg-l').innerText = '-';
                    document.getElementById('leg-c').innerText = '-';
                    return;
                }

                let dateStr = "";
                if (typeof param.time === 'number') {
                    const d = new Date(param.time * 1000);
                    const y = d.getUTCFullYear();
                    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
                    const day = String(d.getUTCDate()).padStart(2, '0');
                    const hh = String(d.getUTCHours()).padStart(2, '0');
                    const mm = String(d.getUTCMinutes()).padStart(2, '0');
                    if (currentTimeframe === '1d') {
                        dateStr = `${y}-${m}-${day}`;
                    } else {
                        dateStr = `${y}-${m}-${day} ${hh}:${mm}`;
                    }
                } else if (typeof param.time === 'object') {
                    const y = param.time.year;
                    const m = String(param.time.month).padStart(2, '0');
                    const day = String(param.time.day).padStart(2, '0');
                    dateStr = `${y}-${m}-${day}`;
                } else {
                    dateStr = String(param.time);
                }
                document.getElementById('leg-date').innerText = dateStr;

                if (param.seriesPrices) {
                    const price = param.seriesPrices.get(candleSeries);
                    if (price) {
                        document.getElementById('leg-o').innerText = price.open ? price.open.toFixed(2) : '-';
                        document.getElementById('leg-h').innerText = price.high ? price.high.toFixed(2) : '-';
                        document.getElementById('leg-l').innerText = price.low ? price.low.toFixed(2) : '-';
                        document.getElementById('leg-c').innerText = price.close ? price.close.toFixed(2) : '-';
                    }
                }
            });

            // ResizeObserver for dynamic responsiveness
            const resizeObserver = new ResizeObserver(entries => {
                for (let entry of entries) {
                    if (chart && entry.contentRect) {
                        chart.resize(entry.contentRect.width, entry.contentRect.height);
                    }
                }
            });
            resizeObserver.observe(container);
        }

        // Live Clock Ticker
        setInterval(() => {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('live-clock');
            if (clockEl) clockEl.innerText = `${h}:${m}:${s} UTC+5:30`;
        }, 1000);

        // Time-range Preset Buttons Handler
        function fitRange(rangeKey) {
            if (!chart || !window.lastData || !window.lastData.candles || window.lastData.candles.length === 0) return;
            const candles = window.lastData.candles;
            const total = candles.length;
            
            let count = total;
            if (rangeKey === '1d') count = Math.min(1, total);
            else if (rangeKey === '5d') count = Math.min(5, total);
            else if (rangeKey === '1m') count = Math.min(22, total);
            else if (rangeKey === '3m') count = Math.min(66, total);
            else if (rangeKey === '6m') count = Math.min(132, total);
            else if (rangeKey === 'ytd') {
                const nowYear = new Date().getFullYear();
                const firstThisYear = candles.findIndex(c => {
                    const tStr = String(c.time);
                    return tStr.startsWith(String(nowYear));
                });
                count = firstThisYear !== -1 ? (total - firstThisYear) : Math.min(132, total);
            }
            else if (rangeKey === '1y') count = Math.min(252, total);
            else if (rangeKey === 'all') count = total;
            
            const fromIdx = Math.max(0, total - count);
            chart.timeScale().setVisibleLogicalRange({ from: fromIdx, to: total - 1 });
        }

        // Load Symbol List
        async function loadSymbols() {
            try {
                const res = await fetch(`/api/symbols?type=${currentMarket}`);
                const symbols = await res.json();
                const select = document.getElementById('symbol-select');
                select.innerHTML = '';
                let matchFound = false;
                symbols.forEach(sym => {
                    const opt = document.createElement('option');
                    opt.value = sym;
                    opt.textContent = sym;
                    if (sym === currentSymbol) {
                        opt.selected = true;
                        matchFound = true;
                    }
                    select.appendChild(opt);
                });
                if (!matchFound && symbols.length > 0) {
                    currentSymbol = symbols[0];
                    select.value = currentSymbol;
                }
            } catch (err) {
                console.error("Error loading symbols:", err);
            }
        }

        // Fetch & Update Chart Data
        async function updateChart() {
            document.getElementById('loader').style.display = 'flex';
            const mLabel = currentMarket === 'futures' ? ' (FUT)' : ' (EQ)';
            document.getElementById('legend-symbol').innerText = `${currentSymbol}${mLabel} - ${currentTimeframe.toUpperCase()}`;

            try {
                const res = await fetch(`/api/data?symbol=${encodeURIComponent(currentSymbol)}&timeframe=${encodeURIComponent(currentTimeframe)}&type=${currentMarket}`);
                const data = await res.json();

                if (data.error) {
                    alert(data.error);
                    document.getElementById('loader').style.display = 'none';
                    return;
                }

                // Set Candle Data
                candleSeries.setData(data.candles);

                // Set Pullback Line Data
                pullbackLine.setData(data.pullback_points);

                // Update Legend to last bar
                if (data.candles.length > 0) {
                    const lastBar = data.candles[data.candles.length - 1];
                    document.getElementById('leg-o').innerText = lastBar.open.toFixed(2);
                    document.getElementById('leg-h').innerText = lastBar.high.toFixed(2);
                    document.getElementById('leg-l').innerText = lastBar.low.toFixed(2);
                    document.getElementById('leg-c').innerText = lastBar.close.toFixed(2);
                }

                window.lastData = data;
                toggleLayers();

                // Toggle time visibility based on timeframe
                chart.timeScale().applyOptions({
                    timeVisible: currentTimeframe !== '1d' && currentTimeframe !== '1w'
                });

                // Fit Content
                chart.timeScale().fitContent();

            } catch (err) {
                console.error("Error updating chart:", err);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }


        let structureLines = [];

        function toggleMaster(isChecked) {
            document.querySelectorAll('.layer-toggle').forEach(cb => {
                cb.checked = isChecked;
            });
            toggleLayers();
        }

        function toggleLayers() {
            if (!window.lastData) return;
            const data = window.lastData;

            const showPullback = document.getElementById('toggle-pullbacks').checked;
            pullbackLine.applyOptions({ visible: showPullback });

            // Clear old structure line series
            structureLines.forEach(l => {
                try { chart.removeSeries(l); } catch(e) {}
            });
            structureLines = [];

            if (data.htf_events && data.htf_events.length > 0) {
                const markers = [];
                const candles = data.candles || [];

                data.htf_events.forEach(ev => {
                    // Ensure bounds are strictly clamped
                    const sTime = ev.start_time;
                    const eTime = ev.end_time > sTime ? ev.end_time : sTime;

                    // Find midpoint timestamp for text in middle of line
                    let midTime = eTime;
                    if (candles.length > 0) {
                        let iStart = candles.findIndex(c => c.time >= sTime);
                        let iEnd = candles.findIndex(c => c.time >= eTime);
                        if (iStart === -1) iStart = 0;
                        if (iEnd === -1) iEnd = candles.length - 1;
                        const iMid = Math.floor((iStart + iEnd) / 2);
                        midTime = candles[iMid] ? candles[iMid].time : eTime;
                    }

                    let position = 'aboveBar';
                    if (ev.type === 'CHOCH' || ev.type === 'IDM') {
                        position = 'belowBar';
                    }

                    markers.push({
                        time: midTime,
                        position: position,
                        color: ev.color,
                        shape: 'circle',
                        text: ev.label
                    });

                    // Draw solid straight line from start_time to end_time
                    const line = chart.addLineSeries({
                        color: ev.color,
                        lineWidth: 2,
                        lineStyle: LightweightCharts.LineStyle.Solid,
                        crosshairMarkerVisible: false,
                        lastValueVisible: false,
                        priceLineVisible: false
                    });
                    line.setData([
                        { time: sTime, value: ev.start_val },
                        { time: eTime, value: ev.end_val }
                    ]);
                    structureLines.push(line);
                });
                candleSeries.setMarkers(markers);
            } else {
                candleSeries.setMarkers([]);
            }
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', async () => {
            // Parse query parameters
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('symbol')) currentSymbol = urlParams.get('symbol').toUpperCase();
            if (urlParams.get('timeframe')) currentTimeframe = urlParams.get('timeframe').toLowerCase();
            if (urlParams.get('type')) currentMarket = urlParams.get('type').toLowerCase();

            // Sync timeframe buttons UI
            document.querySelectorAll('.tf-btn').forEach(btn => {
                if (btn.getAttribute('data-tf') === currentTimeframe) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Sync market select UI
            const mSelect = document.getElementById('market-select');
            if (mSelect) mSelect.value = currentMarket;

            initChart();
            await loadSymbols();

            // Market Select Change
            if (mSelect) {
                mSelect.addEventListener('change', async (e) => {
                    currentMarket = e.target.value;
                    await loadSymbols();
                    updateChart();
                });
            }

            // Symbol Select Change
            document.getElementById('symbol-select').addEventListener('change', (e) => {
                currentSymbol = e.target.value;
                updateChart();
            });

            // Timeframe Button Clicks
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTimeframe = e.target.getAttribute('data-tf');
                    updateChart();
                });
            });

            // Initial chart load
            updateChart();
        });
    </script>
</body>
</html>
